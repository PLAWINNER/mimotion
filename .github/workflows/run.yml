name: 刷步数

on:
  schedule:
    # 北京时间 09:00 / 11:34 / 14:08 / 16:42 / 19:16 / 21:50
    - cron: '0 1 * * *'
    - cron: '34 3 * * *'
    - cron: '8 6 * * *'
    - cron: '42 8 * * *'
    - cron: '16 11 * * *'
    - cron: '50 13 * * *'
    # 补跑检查：北京时间 09:07～22:27 每 20 分钟唤醒；已成功的时段自动跳过。
    - cron: '7,27,47 1-13 * * *'
    - cron: '7,27 14 * * *'
  workflow_dispatch:
    inputs:
      scheduled:
        description: '按计划补跑：已成功的账号跳过，仅在自动运行窗口内提交'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mimotion
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          ref: master

      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 开始
        id: sync
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
          TRIGGER_CRON: ${{ github.event.schedule }}
          SYNC_SCHEDULED: ${{ inputs.scheduled }}
        shell: python
        run: |
          import json
          import os
          import runpy
          import sys
          from urllib.parse import quote, quote_plus
          from datetime import datetime
          from zoneinfo import ZoneInfo

          trigger = (f"触发方式：{os.environ.get('GITHUB_EVENT_NAME')}；"
                     f"计划补跑：{os.environ.get('SYNC_SCHEDULED') or 'false'}；"
                     f"cron：{os.environ.get('TRIGGER_CRON') or '手动'}；"
                     f"实际北京时间：{datetime.now(ZoneInfo('Asia/Shanghai')):%Y-%m-%d %H:%M:%S}")
          print(trigger)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(trigger + "\n")

          try:
              config = json.loads(os.environ.get("CONFIG") or "{}")
              if not isinstance(config, dict):
                  raise ValueError()
          except (ValueError, TypeError):
              sys.exit("CONFIG 格式错误：需要 JSON 对象。")
          # CONFIG 是 JSON Secret；显式注册拆出的凭据及 URL 编码形式。
          for field in ("USER", "PWD"):
              for value in str(config.get(field) or "").split("#"):
                  if value:
                      for sensitive in {value, quote(value, safe=""), quote_plus(value, safe="")}:
                          escaped = sensitive.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          print("::add-mask::" + escaped, flush=True)

          if not config.get("USER") or not config.get("PWD"):
              message = "等待配置：请在 Settings → Secrets and variables → Actions 中编辑 CONFIG，填写 USER 和 PWD。此次未登录、未修改步数。"
              print(message)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(message + "\n")
              sys.exit(1)

          if len(os.environ.get("AES_KEY", "").encode("utf-8")) != 16:
              sys.exit("AES_KEY 缺失或长度不为 16 字节，请检查仓库 Secret。")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("configured=true\n")
          sys.path.insert(0, os.getcwd())
          runpy.run_path("main.py", run_name="__main__")

      - name: 保存加密登录缓存
        if: always() && steps.sync.outputs.configured == 'true'
        run: |
          git add -- encrypted_tokens.data
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update encrypted login cache"
          git push origin HEAD:master
